version: '3.8'

services:
  # Spring Boot Backend (PostgreSQL is external - not in Docker)
  backend:
    build:
      context: ./backend
      # Runtime-only image: CI builds the JAR, server just packages it.
      # For a full local build (Maven inside Docker) use ./backend/Dockerfile.
      dockerfile: Dockerfile.prebuilt
    # REMOVED container_name to allow multiple instances
    # Limit runtime CPU/memory
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2560M
    environment:
      # JVM memory limits sized for the 8GB server. Zero-downtime deploys run TWO
      # backend containers at once, so keep 2x(heap+overhead) + PostgreSQL + OS under 8GB.
      - JAVA_OPTS=-Xms768m -Xmx1536m -XX:+UseG1GC -XX:MaxMetaspaceSize=256m
      # Database configuration
      - DB_URL=${DB_URL:-jdbc:postgresql://host.docker.internal:5432/shop_management_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      # JWT secret (REQUIRED in production)
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-key-here}
      # File upload paths - use CONTAINER paths (/app/uploads), NOT host paths
      # Host path /opt/shop-management/uploads is mounted to container path /app/uploads
      - FILE_UPLOAD_PATH=${FILE_UPLOAD_PATH:-/app/uploads}
      - APP_UPLOAD_DIR=${APP_UPLOAD_DIR:-/app/uploads}
      - DOCUMENT_UPLOAD_PATH=${DOCUMENT_UPLOAD_PATH:-/app/uploads/documents/shops}
      - DELIVERY_PARTNER_DOCUMENT_PATH=${DELIVERY_PARTNER_DOCUMENT_PATH:-/app/uploads/documents/delivery-partners}
      - PRODUCT_IMAGES_PATH=${PRODUCT_IMAGES_PATH:-/app/uploads/products}
      # JPA configuration (for development, use: JPA_DDL_AUTO=update JPA_SHOW_SQL=true)
      - JPA_DDL_AUTO=${JPA_DDL_AUTO:-update}
      - JPA_SHOW_SQL=${JPA_SHOW_SQL:-false}
      # Scheduled jobs control (for zero-downtime deployment)
      - APP_SCHEDULING_ENABLED=${APP_SCHEDULING_ENABLED:-true}
      # Firebase configuration path (mounted from host)
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-config/firebase-service-account.json
      # SMTP / Email
      - MAIL_HOST=${MAIL_HOST:-smtp.hostinger.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-noreplay@nammaoorudelivary.in}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # Razorpay Payment Gateway
      - RAZORPAY_MODE=${RAZORPAY_MODE:-test}
      - RAZORPAY_TEST_KEY_ID=${RAZORPAY_TEST_KEY_ID}
      - RAZORPAY_TEST_KEY_SECRET=${RAZORPAY_TEST_KEY_SECRET}
      - RAZORPAY_LIVE_KEY_ID=${RAZORPAY_LIVE_KEY_ID}
      - RAZORPAY_LIVE_KEY_SECRET=${RAZORPAY_LIVE_KEY_SECRET}
      # MSG91 SMS/WhatsApp
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY}
      - MSG91_SENDER_ID=${MSG91_SENDER_ID:-NAMMAO}
      - MSG91_OTP_TEMPLATE_ID=${MSG91_OTP_TEMPLATE_ID}
      - MSG91_NAMESPACE=${MSG91_NAMESPACE}
      - MSG91_INTEGRATED_NUMBER=${MSG91_INTEGRATED_NUMBER}
      - MSG91_FORGOT_PASSWORD_TEMPLATE_ID=${MSG91_FORGOT_PASSWORD_TEMPLATE_ID}
      - MSG91_WHATSAPP_ENABLED=${MSG91_WHATSAPP_ENABLED:-true}
      # WhatsApp provider: meta (direct Cloud API, default) or msg91 (relay)
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-meta}
      - META_WA_PHONE_NUMBER_ID=${META_WA_PHONE_NUMBER_ID}
      - META_WA_ACCESS_TOKEN=${META_WA_ACCESS_TOKEN}
      - META_WA_API_VERSION=${META_WA_API_VERSION:-v21.0}
      - META_WA_APP_SECRET=${META_WA_APP_SECRET}
      # Inbound webhook handshake secret (same value entered in Meta app -> WhatsApp -> Configuration)
      - META_WA_WEBHOOK_VERIFY_TOKEN=${META_WA_WEBHOOK_VERIFY_TOKEN}
      # Shop whose catalog the WhatsApp order bot suggests from (needed when >1 active shop)
      - WHATSAPP_ORDER_SHOP_ID=${WHATSAPP_ORDER_SHOP_ID:-}
      # Meta Commerce Catalogue id connected to the WABA (enables image product lists + native cart)
      - WHATSAPP_ORDER_CATALOG_ID=${WHATSAPP_ORDER_CATALOG_ID:-}
      # Gemini AI API Keys
      - GEMINI_ENABLED=${GEMINI_ENABLED:-true}
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3}
      - GEMINI_API_KEY_4=${GEMINI_API_KEY_4}
      # Groq AI (fallback when Gemini quota exhausted)
      - GROQ_ENABLED=${GROQ_ENABLED:-true}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      # Microservice feature flag
      - MICROSERVICE_USER_ENABLED=${MICROSERVICE_USER_ENABLED:-false}
      - MICROSERVICE_USER_URL=${MICROSERVICE_USER_URL:-http://46.225.224.191:8081}
    # Expose internal port on localhost only - Docker assigns random host port,
    # bound to 127.0.0.1 so it's never reachable from outside the server directly.
    # Deploy script detects port dynamically and updates Nginx.
    ports:
      - "127.0.0.1::8080"
    volumes:
      # Mount host directory for persistent file storage (production)
      - /mnt/HC_Volume_104749884:/app/uploads
      # Mount firebase-config directory (read-only for security)
      - ./firebase-config:/app/firebase-config:ro
    networks:
      - shop-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      # Short interval so the deploy script detects "healthy" quickly
      # (checks during start_period don't count as failures)
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    # Allow scaling
    labels:
      - "com.shop.service=backend"

  # Angular Frontend is NOT in Docker
  # CI/CD builds with npm and deploys static files to /var/www/html via symlinks
  # Host Nginx serves them directly (faster, saves ~100MB RAM)

networks:
  shop-network:
    driver: bridge
