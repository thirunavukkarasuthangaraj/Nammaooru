name: Deploy to Production (Zero Downtime)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'deployment-automation/docs/**'
      - '.claude/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.HETZNER_HOST }}
  SERVER_USER: ${{ secrets.HETZNER_USER }}

jobs:
  # Step 1: Build ONCE and share artifacts with the deploy jobs
  build:
    name: Build Backend + Frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build backend JAR
      run: |
        cd backend
        mvn clean package -DskipTests
        cp target/*.jar target/app.jar
        echo "✅ Backend build successful"

    - name: Upload backend JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend/target/app.jar
        retention-days: 3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build:production
        echo "✅ Frontend build successful"

    - name: Package frontend build
      run: |
        cd frontend/dist
        tar -czf deploy.tar.gz shop-management-frontend/
        echo "✅ Frontend packaged"

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/deploy.tar.gz
        retention-days: 3

  # Step 2: Deploy Backend with Zero Downtime (prebuilt JAR — no Maven on server)
  deploy-backend:
    name: Deploy Backend (Zero Downtime)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download backend JAR
      uses: actions/download-artifact@v4
      with:
        name: backend-jar
        path: backend/target/

    - name: Copy deployment scripts to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HETZNER_HOST }}
        username: ${{ secrets.HETZNER_USER }}
        password: ${{ secrets.HETZNER_PASSWORD }}
        source: "deployment-automation/"
        target: "/opt/shop-management/"
        strip_components: 0
        overwrite: true

    - name: Copy JAR + Docker files to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HETZNER_HOST }}
        username: ${{ secrets.HETZNER_USER }}
        password: ${{ secrets.HETZNER_PASSWORD }}
        source: "backend/target/app.jar,backend/Dockerfile.prebuilt,backend/.dockerignore,docker-compose.yml"
        target: "/opt/shop-management/"
        strip_components: 0
        overwrite: true

    - name: Deploy backend with zero downtime
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HETZNER_HOST }}
        username: ${{ secrets.HETZNER_USER }}
        password: ${{ secrets.HETZNER_PASSWORD }}
        command_timeout: 15m
        script: |
          echo "════════════════════════════════════════════════════════════"
          echo "   🚀 ZERO DOWNTIME BACKEND DEPLOYMENT"
          echo "════════════════════════════════════════════════════════════"
          echo ""

          cd /opt/shop-management

          # Make script executable
          chmod +x deployment-automation/scripts/zero-downtime-deploy.sh

          # Run zero downtime deployment
          ./deployment-automation/scripts/zero-downtime-deploy.sh

          echo ""
          echo "🔄 Ensuring Nginx is pointing to new backend..."

          # Make Nginx update script executable
          chmod +x deployment-automation/scripts/update-nginx-backend-port.sh

          # Update Nginx to new backend port (safety fallback)
          ./deployment-automation/scripts/update-nginx-backend-port.sh

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "   ✅ BACKEND DEPLOYMENT COMPLETE"
          echo "════════════════════════════════════════════════════════════"

    - name: Verify backend deployment
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HETZNER_HOST }}
        username: ${{ secrets.HETZNER_USER }}
        password: ${{ secrets.HETZNER_PASSWORD }}
        script: |
          echo "Verifying backend health..."

          # Quick health check - 6 retries (1 minute total)
          RETRY_COUNT=0
          MAX_RETRIES=6

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT+1))/$MAX_RETRIES..."

            if curl -f -s https://api.nammaoorudelivary.in/actuator/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy!"
              curl -s https://api.nammaoorudelivary.in/actuator/health
              exit 0
            fi

            echo "Backend not ready yet, waiting 10s..."
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT+1))
          done

          echo "❌ Backend health check failed after $MAX_RETRIES attempts"
          exit 1

  # Step 3: Deploy Frontend with Zero Downtime (runs in PARALLEL with backend)
  deploy-frontend:
    name: Deploy Frontend (Zero Downtime)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/

    - name: Upload frontend build to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HETZNER_HOST }}
        username: ${{ secrets.HETZNER_USER }}
        password: ${{ secrets.HETZNER_PASSWORD }}
        source: "frontend/dist/deploy.tar.gz"
        target: "/opt/shop-management/"
        strip_components: 0
        overwrite: true

    - name: Deploy frontend with zero downtime
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HETZNER_HOST }}
        username: ${{ secrets.HETZNER_USER }}
        password: ${{ secrets.HETZNER_PASSWORD }}
        command_timeout: 10m
        script: |
          echo "════════════════════════════════════════════════════════════"
          echo "   🎨 ZERO DOWNTIME FRONTEND DEPLOYMENT"
          echo "════════════════════════════════════════════════════════════"
          echo ""

          cd /opt/shop-management/frontend/dist

          # Extract build
          tar -xzf deploy.tar.gz
          rm deploy.tar.gz

          # Make script executable
          chmod +x /opt/shop-management/deployment-automation/scripts/zero-downtime-frontend-deploy.sh

          # Run zero downtime deployment
          cd /opt/shop-management
          ./deployment-automation/scripts/zero-downtime-frontend-deploy.sh

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "   ✅ FRONTEND DEPLOYMENT COMPLETE"
          echo "════════════════════════════════════════════════════════════"

    - name: Verify frontend deployment
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HETZNER_HOST }}
        username: ${{ secrets.HETZNER_USER }}
        password: ${{ secrets.HETZNER_PASSWORD }}
        script: |
          echo "Verifying frontend..."
          curl -I https://nammaoorudelivary.in || exit 1
          echo "✅ Frontend is live!"

  # Step 4: Post-deployment summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
    - name: Generate deployment summary
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HETZNER_HOST }}
        username: ${{ secrets.HETZNER_USER }}
        password: ${{ secrets.HETZNER_PASSWORD }}
        script: |
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "   🎉 DEPLOYMENT SUMMARY"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "✅ Backend deployed with ZERO DOWNTIME"
          echo "✅ Frontend deployed with ZERO DOWNTIME"
          echo ""
          echo "🌐 Application URLs:"
          echo "   Frontend: https://nammaoorudelivary.in"
          echo "   API:      https://api.nammaoorudelivary.in"
          echo ""
          echo "📊 Container Status:"
          docker ps --filter "label=com.shop.service=backend" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "📁 Current Frontend Release:"
          readlink /var/www/html
          echo ""
          echo "📂 Deployment Files Location:"
          echo "   /opt/shop-management/deployment-automation/"
          echo ""
          echo "🕐 Deployment Time: $(date)"
          echo "⏱️  Total Downtime: 0 seconds ✨"
          echo ""
          echo "════════════════════════════════════════════════════════════"
