apiVersion: v1
kind: Secret
metadata:
  name: nammaooru-secrets
  namespace: nammaooru
type: Opaque
stringData:
  # Database
  DB_PASSWORD: "your-db-password-here"

  # JWT
  JWT_SECRET: "your-jwt-secret-here"

  # Mail
  MAIL_PASSWORD: "your-mail-password-here"

  # Razorpay
  RAZORPAY_TEST_KEY_ID: "your-razorpay-test-key-id"
  RAZORPAY_TEST_KEY_SECRET: "your-razorpay-test-key-secret"
  RAZORPAY_LIVE_KEY_ID: "your-razorpay-live-key-id"
  RAZORPAY_LIVE_KEY_SECRET: "your-razorpay-live-key-secret"

  # MSG91
  MSG91_AUTH_KEY: "your-msg91-auth-key"
  MSG91_OTP_TEMPLATE_ID: "your-otp-template-id"
  MSG91_NAMESPACE: "your-namespace"
  MSG91_INTEGRATED_NUMBER: "your-integrated-number"
  MSG91_FORGOT_PASSWORD_TEMPLATE_ID: "your-forgot-password-template-id"

  # Gemini AI
  GEMINI_API_KEY_1: "your-gemini-key-1"
  GEMINI_API_KEY_2: "your-gemini-key-2"
  GEMINI_API_KEY_3: "your-gemini-key-3"
  GEMINI_API_KEY_4: "your-gemini-key-4"

  # PostgreSQL (used by postgres pod)
  POSTGRES_PASSWORD: "your-db-password-here"
