apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nammaooru-ingress
  namespace: nammaooru
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"      # For file uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: api.nammaoorudelivary.in       # Your API domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
  # Uncomment below when you have SSL certificate
  # tls:
  #   - hosts:
  #       - api.nammaoorudelivary.in
  #     secretName: nammaooru-tls
