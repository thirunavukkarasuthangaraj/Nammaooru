apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: nammaooru
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nammaooru-backend
  minReplicas: 2      # Always run minimum 2 pods
  maxReplicas: 5      # Scale up to 5 pods when busy
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # Scale up if CPU > 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80    # Scale up if Memory > 80%
