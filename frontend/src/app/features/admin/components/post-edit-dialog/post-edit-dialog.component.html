<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="edit-form">
    <ng-container *ngFor="let field of fields">

      <mat-form-field appearance="outline" *ngIf="field.type === 'text'" class="full-width">
        <mat-label>{{ field.label }}</mat-label>
        <input matInput [formControlName]="field.key">
      </mat-form-field>

      <mat-form-field appearance="outline" *ngIf="field.type === 'number'" class="full-width">
        <mat-label>{{ field.label }}</mat-label>
        <input matInput type="number" [formControlName]="field.key">
      </mat-form-field>

      <mat-form-field appearance="outline" *ngIf="field.type === 'textarea'" class="full-width">
        <mat-label>{{ field.label }}</mat-label>
        <textarea matInput [formControlName]="field.key" rows="3"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" *ngIf="field.type === 'select'" class="full-width">
        <mat-label>{{ field.label }}</mat-label>
        <mat-select [formControlName]="field.key">
          <mat-option *ngFor="let opt of field.options" [value]="opt.value">
            {{ opt.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

    </ng-container>

    <!-- Multi-image editing -->
    <div class="image-section" *ngIf="imageMode === 'multi'">
      <label class="image-section-label">Images</label>
      <div class="image-grid">
        <div class="image-drop-list"
             cdkDropList
             cdkDropListOrientation="horizontal"
             (cdkDropListDropped)="onImageDrop($event)">
          <div class="image-tile draggable"
               *ngFor="let slot of imageSlots; let i = index"
               [class.new]="slot.kind === 'new'"
               [class.primary]="i === 0"
               cdkDrag
               [cdkDragDisabled]="imageSlots.length < 2"
               title="Drag to reorder - the first image is the thumbnail">
            <img [src]="slotImageUrl(slot)" alt="Post image" draggable="false">
            <span class="primary-badge" *ngIf="i === 0">Cover</span>
            <span class="new-badge" *ngIf="slot.kind === 'new'">New</span>
            <button type="button" class="remove-btn" (click)="removeImageSlot(i)" title="Remove image">
              <mat-icon>close</mat-icon>
            </button>
          </div>
        </div>
        <label class="image-tile add-tile">
          <input type="file" accept="image/*" multiple hidden (change)="onFilesSelected($event)">
          <mat-icon>add_photo_alternate</mat-icon>
          <span>Add</span>
        </label>
      </div>
      <p class="paste-hint">Drag an image to reorder - the first one ("Cover") is the post thumbnail. Tip: you can also paste an image (Ctrl+V) to add it.</p>
    </div>

    <!-- Single-image editing (marketplace) -->
    <div class="image-section" *ngIf="imageMode === 'single'">
      <label class="image-section-label">Image</label>
      <div class="image-grid">
        <div class="image-tile" *ngIf="existingSingleImageUrl">
          <img [src]="displayImageUrl(existingSingleImageUrl)" alt="Post image">
          <button type="button" class="remove-btn" (click)="removeSingleImage()" title="Remove image">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <div class="image-tile new" *ngIf="newSingleImagePreview">
          <img [src]="newSingleImagePreview" alt="New image">
          <span class="new-badge">New</span>
          <button type="button" class="remove-btn" (click)="removeNewSingleImage()" title="Remove image">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <label class="image-tile add-tile" *ngIf="!existingSingleImageUrl && !newSingleImagePreview">
          <input type="file" accept="image/*" hidden (change)="onFilesSelected($event)">
          <mat-icon>add_photo_alternate</mat-icon>
          <span>Add</span>
        </label>
      </div>
      <p class="paste-hint">Tip: you can also paste an image (Ctrl+V) to add it.</p>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onSave()">Save</button>
</mat-dialog-actions>
